# Pull staging image from GHCR; do not mount production data.
services:
  hellogroceries-staging:
    image: ghcr.io/ccf5nhyrk2-art/hellogroceries:develop
    container_name: hellogroceries-staging
    restart: unless-stopped
    ports:
      - "10.10.50.181:8089:8080"
    environment:
      OPENAI_API_KEY: ${STAGING_OPENAI_API_KEY:-}
      PANTRY_SCAN_MODEL: ${PANTRY_SCAN_MODEL:-gpt-4.1-mini}
    volumes:
      - hellogroceries_staging_data:/data

volumes:
  hellogroceries_staging_data:
