<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelloGroceries — Sign in</title><style>body{font:16px system-ui;background:#f4f7f5;color:#17251c;display:grid;place-items:center;min-height:95vh}main{background:white;padding:2rem;max-width:420px;width:85%;border-radius:16px;box-shadow:0 8px 30px #0001}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #aaa;border-radius:8px}button{background:#18734b;color:white;border:0;cursor:pointer}#error{color:#a00}</style><main><h1>HelloGroceries</h1><p id="mode">Sign in to your household</p><form id="form"><input type="email" id="email" placeholder="Email" autocomplete="email" required><input type="password" id="password" placeholder="Password" autocomplete="current-password" required minlength="12"><section id="setup" hidden><input id="household" placeholder="Household name"><input id="token" type="password" placeholder="HG_BOOTSTRAP_TOKEN (from server environment)"></section><button>Continue</button></form><p id="error" role="alert"></p></main><script>let setup=false;fetch('/api/auth/status').then(r=>r.json()).then(j=>{setup=j.setup_required;document.getElementById('setup').hidden=!setup;document.getElementById('mode').textContent=setup?'First-time administrator setup':'Sign in to your household';if(j.authenticated)location.replace('/')});document.getElementById('form').onsubmit=async e=>{e.preventDefault();const data={email:document.getElementById('email').value,password:document.getElementById('password').value};if(setup){data.household=document.getElementById('household').value;data.bootstrap_token=document.getElementById('token').value}try{const r=await fetch(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);location.replace('/')}catch(e){document.getElementById('error').textContent=e.message}}</script></html>
