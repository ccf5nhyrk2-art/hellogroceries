<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>HelloGroceries — Account</title>
<style>body{font:16px system-ui;background:#f4f7f5;color:#17251c;display:grid;place-items:center;min-height:95vh}main{background:white;padding:2rem;max-width:420px;width:85%;border-radius:16px;box-shadow:0 8px 30px #0001}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #aaa;border-radius:8px}button{background:#18734b;color:white;border:0;cursor:pointer}#error{color:#a00}
/* Shared dark theme */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"],html[data-theme="dark"] body{background:#101b17!important;color:#e7f2eb!important}

html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#20352a!important;color:#f1faf4!important;border-color:#54715e!important}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#b4c6ba!important}
html[data-theme="dark"] .muted,html[data-theme="dark"] .account-meta,html[data-theme="dark"] .account-count,html[data-theme="dark"] .status,html[data-theme="dark"] .done{color:#bacfc1!important}
html[data-theme="dark"] a{color:#91e7b4}
html[data-theme="dark"] .button-secondary,html[data-theme="dark"] button.clear,html[data-theme="dark"] .photo-edit,html[data-theme="dark"] .tag{background:#294a38!important;color:#e6f6eb!important;border-color:#456c52!important}
html[data-theme="dark"] .button-danger{background:#482b2b!important;color:#ffb9b5!important;border-color:#8e5250!important}
html[data-theme="dark"] .tag.admin{background:#273e5b!important;color:#c0dbff!important}
html[data-theme="dark"] .tag.never{background:#303d35!important;color:#d0ded4!important}
html[data-theme="dark"] .error,html[data-theme="dark"] #error{color:#ffaaa7!important}
html[data-theme="dark"] .recipe-photo,html[data-theme="dark"] .photo-placeholder{background:#263a30!important}
html[data-theme="dark"] .row,html[data-theme="dark"] .section{border-color:#365347!important}
#hg-theme-toggle{position:fixed;right:16px;bottom:16px;z-index:9999;background:#176b4a;color:white;border:1px solid #91b9a0;border-radius:999px;padding:10px 14px;font:600 14px system-ui;box-shadow:0 3px 14px #0004;cursor:pointer}
#hg-theme-toggle:focus-visible{outline:3px solid #e0bd66;outline-offset:3px}

/* Neutral charcoal dark mode; green remains an accent only. */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"],html[data-theme="dark"] body{background:#0d0f11!important;color:#edf0f2!important}
html[data-theme="dark"] main,html[data-theme="dark"] section,html[data-theme="dark"] article,html[data-theme="dark"] details,html[data-theme="dark"] .card,html[data-theme="dark"] .recipe-card,html[data-theme="dark"] .account-card,html[data-theme="dark"] .enhance-panel,html[data-theme="dark"] .selected-plan,html[data-theme="dark"] .shopping-department,html[data-theme="dark"] .ingredient-preview,html[data-theme="dark"] .mobile-bottom-nav,html[data-theme="dark"] .mobile-more-nav{background:#171a1e!important;color:#edf0f2!important;border-color:#353b40!important}
html[data-theme="dark"] .row,html[data-theme="dark"] .section,html[data-theme="dark"] .selected-meal,html[data-theme="dark"] .grocery-item-wrap,html[data-theme="dark"] .grocery-row{background:#171a1e!important;color:#edf0f2!important;border-color:#343a40!important}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#23272b!important;color:#f3f5f6!important;border-color:#535b62!important}
html[data-theme="dark"] .enhance-panel h3,html[data-theme="dark"] .selected-plan h3,html[data-theme="dark"] .shopping-department h3,html[data-theme="dark"] .selected-meal,html[data-theme="dark"] .shopping-department summary,html[data-theme="dark"] .shopping-department .department-count{color:#e7ebee!important}
html[data-theme="dark"] .shopping-department>summary{background:#252a2e!important;border-color:#3b4248!important}
html[data-theme="dark"] .shopping-department .department-items{background:#171a1e!important}
html[data-theme="dark"] .shopping-department .row,html[data-theme="dark"] .shopping-department .grocery-item-wrap{border-bottom:1px solid #30363b!important}
html[data-theme="dark"] .shopping-department button[data-edit-item]{background:#30373d!important;color:#f0f4f5!important;border:1px solid #525c64!important}
html[data-theme="dark"] .shopping-department button[data-edit-item]:hover{background:#414b53!important}
html[data-theme="dark"] .grocery-breakdown>summary,html[data-theme="dark"] .grocery-breakdown-content,html[data-theme="dark"] .grocery-note{color:#a7d9bb!important}
html[data-theme="dark"] .shopping-department .qty,html[data-theme="dark"] .muted,html[data-theme="dark"] .done{color:#b8c1c8!important}
html[data-theme="dark"] .mobile-bottom-nav .mobile-tab{color:#cbd2d7!important}
html[data-theme="dark"] .mobile-bottom-nav .mobile-tab-active{background:#30363b!important;color:#f0f4f5!important}
html[data-theme="dark"] .button-secondary,html[data-theme="dark"] button.clear,html[data-theme="dark"] .photo-edit{background:#30363b!important;color:#f0f4f5!important;border-color:#535b62!important}
html[data-theme="dark"] #hg-theme-toggle{background:#30363b!important;border-color:#59636a!important;color:#f2f4f5!important}
</style><script>(function(){try{var t=localStorage.getItem('hg-theme');document.documentElement.dataset.theme=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}})();</script></head>
<body><main><h1>HelloGroceries</h1><p id="mode">Checking your account…</p><form id="form" hidden><input type="email" id="email" placeholder="Email" autocomplete="email" required><input type="password" id="password" placeholder="Password (12+ characters)" autocomplete="new-password" required minlength="12"><section id="household-section" hidden><input id="household" placeholder="Household name" maxlength="80"></section><button id="submit">Continue</button></form><p id="error" role="alert"></p><p id="resend-wrap" hidden><button type="button" id="resend">Resend verification email</button></p><p id="switch" hidden><button type="button" id="toggle">Request an account</button></p></main>
<script>
const $=id=>document.getElementById(id);
const fragment=new URLSearchParams(location.hash.slice(1));
const invite=fragment.get('invite');
const verification=fragment.get('verify');
history.replaceState(null,'',location.pathname+location.search);
let mode='login';
async function initialize(){
 try{
  const r=await fetch('/api/auth/status',{cache:'no-store'}),s=await r.json();
  if(s.authenticated){location.replace('/');return}
  mode=verification?'verify':invite?'redeem':s.setup_required?'setup':'login';
  $('mode').textContent={verify:'Verify your email address',redeem:'Accept your household invitation',setup:'Create the first administrator account',login:'Sign in to your household'}[mode];
  $('household-section').hidden=mode==='login'||mode==='verify';
  $('password').hidden=mode==='verify';$('password').required=mode!=='verify';$('email').hidden=mode==='verify';$('email').required=mode!=='verify';
  $('submit').textContent=mode==='verify'?'Verify email':'Continue';
  $('resend-wrap').hidden=mode==='setup'||mode==='redeem'||mode==='verify';
  $('switch').hidden=mode==='setup'||mode==='redeem'||mode==='verify';
  $('password').autocomplete=mode==='login'?'current-password':'new-password';
  $('form').hidden=false;
 }catch(e){$('error').textContent='Unable to check account status'}
}
$('form').onsubmit=async e=>{
 e.preventDefault();$('error').textContent='';
 const data={email:$('email').value,password:$('password').value};
 if(mode!=='login')data.household=$('household').value;
 if(mode==='redeem')data.token=invite;
 if(mode==='verify')data.token=verification;
 const endpoint={redeem:'/api/auth/redeem',setup:'/api/auth/setup',login:'/api/auth/login',register:'/api/auth/register',verify:'/api/auth/verify'}[mode];
 try{
  const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to sign in');
  if(mode==='verify'){$('mode').textContent='Email verified';$('form').hidden=true;$('error').style.color='#176b4a';$('error').textContent=j.message||'You can now sign in.';$('switch').hidden=false;$('toggle').textContent='Sign in';return;}
  if(mode==='register'){
   mode='login';
   $('mode').textContent='Sign in to your household';
   $('household-section').hidden=true;
   $('password').value='';
   $('password').autocomplete='current-password';
   $('submit').textContent='Sign In';
   $('toggle').textContent='Create an account';
   $('error').style.color='#176b4a';
   $('error').textContent=j.message||'Check your inbox to verify your email.';
   return;
  }
  location.replace('/');
 }catch(e){$('error').textContent=e.message}
};
$('toggle').onclick=()=>{
 mode=mode==='login'?'register':'login';
 $('form').hidden=false;$('email').hidden=false;$('email').required=true;$('password').hidden=false;$('password').required=true;
 $('mode').textContent=mode==='register'?'Create your HelloGroceries account':'Sign in to your household';
 $('household-section').hidden=mode==='login';
 $('password').autocomplete=mode==='login'?'current-password':'new-password';
 $('toggle').textContent=mode==='login'?'Create an account':'Already have an account? Sign in';
 $('error').textContent='';$('error').style.color='#a00';
};
$('resend').onclick=async()=>{const email=$('email').value.trim();if(!email){$('error').textContent='Enter your email address first.';return}try{const r=await fetch('/api/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to resend');$('error').style.color='#176b4a';$('error').textContent=j.message}catch(e){$('error').textContent=e.message}};
initialize();
</script><script>(function(){const b=document.createElement('button');b.id='hg-theme-toggle';b.type='button';b.setAttribute('aria-label','Toggle light and dark mode');function sync(){const dark=document.documentElement.dataset.theme==='dark';b.textContent=dark?'☀ Light mode':'☾ Dark mode';b.setAttribute('aria-pressed',String(dark))}b.addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('hg-theme',theme)}catch(e){}sync()});document.body.appendChild(b);sync()})()</script></body></html>
