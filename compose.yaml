services:
  hellogroceries:
    image: ghcr.io/ccf5nhyrk2-art/hellogroceries:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8080"
    volumes:
      - ./data:/data

  us-importer:
    image: ghcr.io/ccf5nhyrk2-art/hellogroceries:latest
    profiles: ["us-import"]
    command: ["python", "-u", "import_us_all.py"]
    volumes:
      - ./data:/data
    restart: "no"
