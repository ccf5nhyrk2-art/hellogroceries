services:
  hellogroceries:
    image: ghcr.io/ccf5nhyrk2-art/hellogroceries:latest
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PANTRY_SCAN_MODEL: ${PANTRY_SCAN_MODEL:-gpt-4.1-mini}
    ports:
      - "${HOST_PORT:-8088}:8080"
    volumes:
      - ./data:/data

  us-importer:
    image: ghcr.io/ccf5nhyrk2-art/hellogroceries:latest
    profiles: ["us-import"]
    command: ["python", "-u", "import_us_all.py"]
    volumes:
      - ./data:/data
    restart: "no"
