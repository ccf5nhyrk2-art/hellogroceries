services:
  hellofresh:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8080"
    volumes:
      - ./data:/data

  us-importer:
    build: .
    profiles: ["us-import"]
    command: ["python", "-u", "import_us_all.py"]
    volumes:
      - ./data:/data
    restart: "no"