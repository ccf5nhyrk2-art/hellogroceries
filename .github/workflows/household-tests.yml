name: Household security tests
on:
  push:
    branches:
      - feature/invite-only-households
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run household tests
        run: python -m unittest discover -s tests -p 'test_households.py' -v
