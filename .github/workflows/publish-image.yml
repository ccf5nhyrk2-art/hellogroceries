name: Build and publish HelloGroceries image

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/ccf5nhyrk2-art/hellogroceries:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
            ghcr.io/ccf5nhyrk2-art/hellogroceries:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ccf5nhyrk2-art/hellogroceries
