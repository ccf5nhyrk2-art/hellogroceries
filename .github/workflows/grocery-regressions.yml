name: Grocery regression tests
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  grocery-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q app tests
      - name: Run grocery ingredient regression tests
        run: python -m unittest discover -s tests -p 'test_grocery_measures.py' -v
      - name: Run grocery list integration regressions
        run: python -m unittest discover -s tests -p 'test_grocery_list_regressions.py' -v
