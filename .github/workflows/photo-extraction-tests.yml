name: Photo extraction regression tests
on:
  pull_request:
    paths:
      - 'app/server.py'
      - 'app/test_embedded_photo_extraction.py'
      - '.github/workflows/photo-extraction-tests.yml'
  push:
    branches: [develop]
    paths:
      - 'app/server.py'
      - 'app/test_embedded_photo_extraction.py'
      - '.github/workflows/photo-extraction-tests.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s app -p 'test_embedded_photo_extraction.py' -v
